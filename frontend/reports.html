<!--RetailPulse - frontend/reports.html-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="js/tailwind-config.js"></script>
        <title>Reports · RetailPulse</title>
    </head>
    <body data-page="reports" class="bg-background font-body-md text-body-md text-on-surface antialiased">
        <div id="app" class="pl-64">
            <main class="pt-16 px-space-lg pb-space-xl min-h-screen">
                <div class="flex flex-col gap-space-lg pt-space-lg">
                    <div class="flex items-end justify-between flex-wrap gap-space-md">
                        <div>
                            <h1 class="font-headline-lg text-headline-lg font-bold">Reports</h1>
                            <p class="text-on-surface-variant">Revenue, profit, and category performance.</p>
                        </div>
                        <select id="range" aria-label="Date range" class="h-10 px-space-md bg-surface-container-lowest rounded-xl shadow-sm focus:outline-none">
                            <option value="4">Last 4 weeks</option>
                            <option value="8" selected>Last 8 weeks</option>
                        </select>
                    </div>
                    <div id="kpis" class="grid grid-cols-1 md:grid-cols-3 gap-space-md"></div>
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-space-lg">
                        <section class="lg:col-span-8 bg-surface-container-lowest p-space-lg rounded-xl shadow-sm">
                            <div class="flex justify-between items-center mb-space-md">
                                <h2 class="font-title-md text-title-md font-bold">Weekly revenue</h2>
                                <button data-export="weekly" class="text-primary font-title-sm hover:underline">Export CSV</button>
                            </div>
                            <svg id="chart" viewBox="0 0 640 240" class="w-full h-64" role="img" aria-label="Weekly revenue bar chart"></svg>
                        </section>
                        <section class="lg:col-span-4 bg-surface-container-lowest p-space-lg rounded-xl shadow-sm">
                            <div class="flex justify-between items-center mb-space-md"><h2 class="font-title-md text-title-md font-bold">Sales by category</h2>
                                <button data-export="category" class="text-primary font-title-sm hover:underline">Export CSV</button>
                            </div>
                            <div id="cats" class="flex flex-col gap-space-md"></div>
                        </section>
                    </div>
                </div>
            </main>
        </div>
        <script src="js/layout.js"></script>
        <script src="js/data.js"></script>
        <script type="module">
            if (!RP.isAdmin) { location.replace("dashboard.html"); throw new Error("Admins only"); }
            await DB.boot();
            const el = id => document.getElementById(id), esc = RP.esc;
            const state = { weekly: [], cats: [] };

            function draw() {
                const data = state.weekly;
                const max = Math.max(...data.map(d => d[1]), 1), w = 640 / Math.max(data.length, 1);

                el("chart").innerHTML = data.map(([label, rev, profit], i) => {
                    const h = rev / max * 190, hp = Math.max(profit, 0) / max * 190, x = i * w + w * 0.2, bw = w * 0.6;
                    return `<g><title>${esc(label)}: ${RP.fmt(rev)} revenue, ${RP.fmt(profit)} profit</title>
                    <rect x="${x}" y="${200 - h}" width="${bw}" height="${h}" rx="6" fill="#4f46e5" opacity=".25"/>
                    <rect x="${x}" y="${200 - hp}" width="${bw}" height="${hp}" rx="6" fill="#4f46e5"/>
                    <text x="${x + bw / 2}" y="222" text-anchor="middle" font-size="11" fill="#464555">${esc(label)}</text></g>`;
                }).join("");

                const rev = data.reduce((s, d) => s + d[1], 0), pr = data.reduce((s, d) => s + d[2], 0);
                el("kpis").innerHTML = [["Revenue", RP.fmt(rev)], ["Gross profit", RP.fmt(pr)], ["Profit margin", rev ? (pr / rev * 100).toFixed(1) + "%" : "—"]]
                    .map(([l, v]) => `<div class="bg-surface-container-lowest p-space-lg rounded-xl shadow-sm"><span class="font-label-md text-on-surface-variant">${l}</span>
                    <p class="font-headline-lg text-headline-lg font-bold">${v}</p></div>`).join("");

                const total = state.cats.reduce((s, c) => s + c[1], 0) || 1;
                el("cats").innerHTML = state.cats.map(([n, v]) => `<div><div class="flex justify-between"><span class="font-title-sm">${esc(n)}</span>
                    <span class="tabular-nums text-on-surface-variant">${RP.fmt(v)}</span></div>
                    <div class="h-2 rounded-full bg-surface-container-high mt-1"><div class="h-full rounded-full bg-primary-container" style="width:${v / total * 100}%"></div></div></div>`).join("")
                    || `<p class="text-on-surface-variant">No sales data yet.</p>`;
            }

            async function load(n) {
                try {
                    const [weekly, cats] = await Promise.all([DB.weekly(n), DB.categories(n)]);
                    Object.assign(state, { weekly, cats });
                    draw();
                } catch (err) { RP.toast(err.message); }
            }

            el("range").addEventListener("change", e => load(+e.target.value));
            document.addEventListener("click", e => {
                const b = e.target.closest("[data-export]"); if (!b) return;
                b.dataset.export === "weekly"
                    ? RP.download("weekly-revenue.csv", [["Week", "Revenue", "Profit"], ...state.weekly])
                    : RP.download("sales-by-category.csv", [["Category", "Sales"], ...state.cats]);
                RP.toast("Report exported");
            });
            load(+el("range").value);
        </script>
    </body>
</html>
