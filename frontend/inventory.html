<!--RetailPulse - frontend/inventory.html-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="js/tailwind-config.js"></script>
        <title>Inventory · RetailPulse</title>
    </head>
    <body data-page="inventory" class="bg-background font-body-md text-body-md text-on-surface antialiased">
        <div id="app" class="pl-64">
            <main class="pt-16 px-space-lg pb-space-xl min-h-screen">
                <div id="view" class="flex flex-col gap-space-lg pt-space-lg"></div>
            </main>
        </div>
        <script src="js/layout.js"></script>
        <script src="js/data.js"></script>
        <script src="js/ui.js"></script>
        <script type="module">
            await DB.boot(["products", "movements"]);

            const { $, header, kpi, input, th } = UI;
            const esc = RP.esc;
            const TYPES = { IN: ["Stock in", "bg-secondary-container text-on-secondary-container"], OUT: ["Stock out", "bg-primary-container text-on-primary"], ADJUSTMENT: ["Adjustment", "bg-tertiary-fixed text-on-tertiary-fixed"] };
            const state = { type: "All", q: "" };
            const units = DB.products.reduce((s, p) => s + p.stock, 0);

            const adjustBtn = RP.isAdmin
                ? `<button id="adjust" class="${UI.btn}"><span class="material-symbols-outlined text-[20px]">tune</span>Adjust stock</button>`
                : "";
            const exportBtn = `<button id="export" class="flex items-center gap-2 bg-surface-container-lowest px-space-lg py-2.5 rounded-xl font-title-sm shadow-sm hover:bg-surface-container-low"><span class="material-symbols-outlined text-[18px]">download</span>Export CSV</button>`;

            $("#view").innerHTML = `
            ${header("Inventory", "Stock levels and the full movement history.", `<div class="flex gap-space-sm">${adjustBtn}${exportBtn}</div>`)}
            <div class="grid grid-cols-1 md:grid-cols-3 gap-space-md">${kpi("Units in stock", units.toLocaleString(), "inventory_2", DB.products.length + " SKUs")}
                ${kpi("Low stock", DB.products.filter(p => DB.status(p) === "Low Stock").length, "warning")}${kpi("Out of stock", DB.products.filter(p => p.stock === 0).length, "remove_shopping_cart")}</div>
            <div class="bg-surface-container-lowest rounded-xl shadow-sm">
                <div class="p-space-md flex flex-wrap justify-between gap-space-md"><div id="tabs" class="flex gap-1 bg-surface-container-low p-1 rounded-xl"></div>
                <input id="q" type="search" placeholder="Search SKU, product, or movement ID" aria-label="Search movements" class="${input} w-80"/></div>
                <div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="bg-surface-container-low text-on-surface-variant">
                ${["Date & time", "ID", "Product", "Type", "Qty", "Balance", "Reference", "Logged by"].map((h, i) => `<th class="${th} ${i > 3 && i < 6 ? "text-right" : ""}">${h}</th>`).join("")}</tr></thead>
                <tbody id="rows" class="divide-y divide-surface-container-low"></tbody></table></div></div>
            <dialog id="adj-dlg" class="rounded-xl p-0 w-full max-w-md backdrop:bg-black/40">
                <form id="adj-form" method="dialog" class="p-space-lg flex flex-col gap-space-md">
                    <h2 class="font-headline-sm text-headline-sm font-bold">Adjust stock</h2>
                    <select id="adj-sku" name="sku" required aria-label="Product" class="${input}"></select>
                    <div class="grid grid-cols-2 gap-space-md">
                        <select name="dir" aria-label="Direction" class="${input}"><option value="in">Increase (+)</option><option value="out">Decrease (−)</option></select>
                        <input name="qty" type="number" min="1" step="1" required placeholder="Quantity" aria-label="Quantity" class="${input}"/>
                    </div>
                    <input name="reason" placeholder="Reason (e.g. Damaged items)" aria-label="Reason" class="${input}"/>
                    <div class="flex justify-end gap-space-sm">
                        <button value="cancel" formnovalidate class="h-10 px-space-lg rounded-xl bg-surface-container-low font-title-sm">Cancel</button>
                        <button class="h-10 px-space-lg rounded-xl bg-primary-container text-on-primary font-title-sm">Apply</button>
                    </div>
                </form>
            </dialog>`;

            const visible = () => DB.movements.filter(m => (state.type === "All" || m.type === state.type) &&
                `${m.id} ${m.sku} ${m.product ?? ""}`.toLowerCase().includes(state.q));

            function render() {
                $("#tabs").innerHTML = ["All", ...Object.keys(TYPES)].map(t => `<button data-t="${t}" class="px-space-md py-1.5 rounded-lg font-title-sm ${t === state.type ? "bg-surface-container-lowest text-primary shadow-sm" : "text-on-surface-variant"}">${TYPES[t]?.[0] ?? "All movements"}</button>`).join("");
                $("#rows").innerHTML = visible().map(m => `<tr class="hover:bg-surface-container-low/60"><td class="px-space-md py-3 whitespace-nowrap">${m.at}</td><td class="px-space-md text-primary font-semibold">#${esc(m.id)}</td>
                    <td class="px-space-md"><p class="font-title-sm text-title-sm">${esc(m.product ?? m.sku)}</p>
                    <p class="font-body-sm text-on-surface-variant">${esc(m.sku)}</p></td>
                    <td class="px-space-md"><span class="px-2.5 py-1 rounded-full font-label-sm ${TYPES[m.type][1]}">${TYPES[m.type][0]}</span></td>
                    <td class="px-space-md text-right font-bold tabular-nums ${m.qty > 0 ? "text-secondary" : "text-error"}">${m.qty > 0 ? "+" : ""}${m.qty}</td>
                    <td class="px-space-md text-right tabular-nums">${m.balance}</td><td class="px-space-md text-on-surface-variant">${esc(m.ref)}</td><td class="px-space-md">${esc(m.by)}</td></tr>`).join("");
            }

            document.addEventListener("click", e => { const t = e.target.closest("[data-t]"); if (t) { state.type = t.dataset.t; render(); } });
            $("#q").addEventListener("input", e => { state.q = e.target.value.toLowerCase(); render(); });

            $("#export").addEventListener("click", () => RP.download("stock-movements.csv",
                [["Date", "ID", "SKU", "Type", "Qty", "Balance", "Reference", "By"],
                 ...visible().map(m => [m.at, m.id, m.sku, m.type, m.qty, m.balance, m.ref, m.by])]));

            $("#adjust")?.addEventListener("click", () => {
                $("#adj-sku").innerHTML = DB.products.map(p => `<option value="${esc(p.sku)}">${esc(p.name)} (${esc(p.sku)}) · ${p.stock}</option>`).join("");
                $("#adj-dlg").showModal();
            });

            $("#adj-form").addEventListener("submit", async e => {
                if (e.submitter.value === "cancel") return;
                e.preventDefault();
                const f = Object.fromEntries(new FormData(e.target));
                try {
                    await DB.adjustStock({ sku: f.sku, qty: (f.dir === "out" ? -1 : 1) * +f.qty, reason: f.reason });
                    RP.toast("Stock adjusted");
                    $("#adj-dlg").close();
                    setTimeout(() => location.reload(), 600);
                } catch (err) { RP.toast(err.message); }
            });

            render();
        </script>
    </body>
</html>
